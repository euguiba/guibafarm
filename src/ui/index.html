<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'" />
  <title>Navegador Idle</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside id="sidebar">
    <div class="side-head">
      <img class="logo" src="logo.png" alt="" />
      <span class="brand">Navegador Idle</span>
      <button id="collapse" class="ghost" title="Recolher a barra (Ctrl+B)">‹</button>
    </div>

    <nav id="rail" aria-label="Contas"></nav>

    <div class="side-body">
    <section>
      <div class="row">
        <h2>Contas</h2>
        <span id="open-count" class="pill">0 abertas</span>
        <button id="new-account" class="ghost small" title="Adicionar conta">+ Nova</button>
      </div>
      <form id="add-form" hidden>
        <select id="game-select"></select>
        <input id="site-input" placeholder="Endereço do site, ex.: jogo.com.br" hidden />
        <input id="label-input" placeholder="Apelido da conta" />
        <button type="submit" class="primary">Adicionar</button>
      </form>
      <p id="add-warning" class="warning" hidden></p>
      <div id="profile-groups"></div>
    </section>

    <section>
      <h2>Alertas</h2>
      <ul id="alerts"><li class="muted">Nenhum alerta ainda.</li></ul>
    </section>

    <section id="detail" hidden>
      <h2 id="detail-title"></h2>
      <dl id="state"></dl>

      <h3>Recomendações</h3>
      <ul id="recs"></ul>

      <div id="hunts-section" hidden>
        <h3>Comparar caçadas</h3>
        <div class="filters">
          <label class="inline"><input id="hunts-all" type="checkbox" checked /> Todas as contas</label>
          <label class="inline"><input id="hunts-near" type="checkbox" /> <span id="hunts-near-label">Perto do meu nível</span></label>
          <select id="hunts-sort">
            <option value="money">Ordenar por lucro</option>
            <option value="xp">Ordenar por XP</option>
          </select>
        </div>
        <ul id="hunts"></ul>
        <details>
          <summary>Sessões recentes</summary>
          <ul id="hunt-sessions"></ul>
        </details>
      </div>

      <h3>Preços</h3>
      <label class="inline">R$ por 1.000 de ouro <input id="gold-price" type="number" step="0.01" min="0" /></label>

      <div id="automation-box">
        <h3>Automação</h3>
        <label class="inline"><input id="automation" type="checkbox" /> Ligada nesta conta</label>
      </div>
      <p id="policy-note" class="muted"></p>

      <h3>Assistente</h3>
      <div id="chat"></div>
      <form id="ask-form">
        <input id="question" placeholder="Ex.: vale trocar de caça agora?" />
        <button type="submit">Perguntar</button>
      </form>
    </section>
    </div>
  </aside>
  <div id="workspace">
    <header id="topbar">
      <div class="segmented" id="layouts">
        <button data-layout="1x1" title="Uma tela">1x1</button>
        <button data-layout="split" title="Duas telas lado a lado">Split</button>
        <button data-layout="2x2" title="Quatro telas">2x2</button>
        <button data-layout="3x3" title="Nove telas">3x3</button>
      </div>
      <form class="urlbar" id="url-form">
        <input id="url-input" placeholder="Endereço ou pesquisa · abre na conta em foco" spellcheck="false" />
        <button type="submit" class="ghost small">Ir</button>
      </form>
      <div class="meter" title="Uso de CPU do app"><span>CPU</span><b id="m-cpu">—</b></div>
      <div class="meter" title="Memória usada pelo app"><span>RAM</span><b id="m-ram">—</b></div>
      <button id="turbo" class="toggle" title="Desacelera as telas fora de foco para sobrar desempenho para a que você está usando">Turbo <b>off</b></button>
      <button id="reload-all" class="ghost" title="Recarregar todas as contas abertas">⟳</button>
    </header>
    <main id="stage"><div id="empty">Adicione uma conta e clique em Abrir.</div></main>
  </div>
  <div id="tile-layer"></div>
  <script src="renderer.js"></script>
</body>
</html>
