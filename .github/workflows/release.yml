# Gera o instalador do Windows e publica como release no GitHub.
# O app instalado procura essas releases e se atualiza sozinho.
# Para lançar uma versão: aumentar "version" no package.json e enviar para a main.
name: Lançar versão

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      # O electron-builder só monta; a release é criada de uma vez só pelo gh, com o instalador e o
      # latest.yml juntos (publicando pelo electron-builder saíam releases duplicadas sem o latest.yml).
      - name: Instalador
        run: npx electron-builder --win nsis --publish never
      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/Navegador-Idle-Setup-*.exe release/*.blockmap release/latest.yml --clobber
          else
            gh release create "$tag" release/Navegador-Idle-Setup-*.exe release/*.blockmap release/latest.yml --title "Navegador Idle ${tag#v}" --notes "Versão ${tag#v}" --target "$GITHUB_SHA"
          fi
