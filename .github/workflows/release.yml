# Gera o instalador do Windows e publica como release no GitHub.
# O app instalado procura essas releases e se atualiza sozinho.
# Para lançar uma versão: aumentar "version" no package.json, criar a tag v<versão> e enviar.
name: Lançar versão

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Instalador e publicação
        run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
